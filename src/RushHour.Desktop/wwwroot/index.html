<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rush Hour Garage</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <div id="app">
        <div class="boot">
            <div class="boot-card">
                <p class="boot-brand">RUSH HOUR <span>GARAGE</span></p>
                <div class="boot-road" aria-hidden="true">
                    <span class="boot-car"></span>
                </div>
                <p class="boot-text">ガレージを開けています…</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span class="err-text">予期しないエラーが発生しました。</span>
        <a href="" class="reload">再読み込み</a>
        <a class="dismiss" role="button" aria-label="閉じる">×</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script src="drag.js"></script>
</body>
</html>
